[project]
name = "glr"
version = "0.1.0"
description = "GreenLight Research: multi-agent deep research that tells you if your research idea was already done"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "tavily-python>=0.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "json-repair>=0.64.0",
    "pypdf>=5.0",
    "google-auth>=2.40",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["glr"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
